name: Build and upload Where Is That Plane to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/WhereIsThatPlane.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Configure signing for this runner
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Keep bundle identifier/profile name in sync with the App ID/profile you create in Apple Developer.
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" Support/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.intellobyte.flightlookup $PROFILE_NAME" Support/ExportOptions.plist
          sed -i '' "s/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: $TEAM_ID/" project.yml
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER: .*/PROVISIONING_PROFILE_SPECIFIER: \"$PROFILE_NAME\"/" project.yml
          xcodegen generate --spec project.yml

      - name: Archive app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project WhereIsThatPlane.xcodeproj \
            -scheme WhereIsThatPlane \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WhereIsThatPlane.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WhereIsThatPlane.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Support/ExportOptions.plist

      - name: Save IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThatPlane-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build to TestFlight
        # v1 (altool) validates the IPA with Apple and fails the job on rejection; same setup as autoedit-ai.
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/WhereIsThatPlane.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
