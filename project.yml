name: WhereIsThatPlane
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  WhereIsThatPlane:
    type: application
    platform: iOS
    sources:
      - path: WhereIsThatPlane
    # Generated by XcodeGen; Xcode merges it with the INFOPLIST_KEY_* settings below.
    info:
      path: Support/Info.plist
      properties:
        # Pin these so XcodeGen's literal defaults ("1.0"/"1") can't shadow the build settings
        # (CI sets CURRENT_PROJECT_VERSION to the run number; TestFlight rejects duplicates).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only on iPad is allowed only for full-screen apps.
        UIRequiresFullScreen: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.intellobyte.flightlookup.skycheck]
    settings:
      base:
        PRODUCT_NAME: WhereIsThatPlane
        PRODUCT_BUNDLE_IDENTIFIER: com.intellobyte.flightlookup
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Where Is That Plane?"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location helps find aircraft flying near you."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Get alerts when an aircraft is detected near your location."
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Support/WhereIsThatPlane.entitlements
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: Z87B7YT54Y
        PROVISIONING_PROFILE_SPECIFIER: "WhereIsThatPlane App Store"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
